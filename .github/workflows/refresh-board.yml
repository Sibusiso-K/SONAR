name: Refresh board

# The site is a static export: every countdown ("14d") is computed at BUILD
# time, not in the browser. Without a scheduled rebuild the numbers freeze on
# the day of the last push and quietly go wrong — which is exactly the failure
# mode SONAR exists to prevent.
#
# So: rebuild every morning before the 08:00 SAST board review.
#
# Two jobs, deliberately separate:
#   regenerate — recompute derived fields, commit only if something changed
#   deploy     — ping Vercel's deploy hook so the site rebuilds regardless
#
# The deploy step runs even when nothing changed, because "nothing changed in
# the data" still means "every countdown is one day shorter".

on:
  schedule:
    # 03:10 UTC = 05:10 SAST. Ahead of the Monday 08:00 review, and off the
    # hour because GitHub's scheduler is heavily contended on :00.
    - cron: "10 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "web/**"
      - ".github/workflows/refresh-board.yml"

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild opportunities.json from the source of truth
        run: python3 scripts/migrate_to_opportunities.py

      - name: Validate against the schema
        run: |
          python3 - <<'PY'
          import json, sys
          board = json.load(open("data/opportunities.json"))
          ids = [o["id"] for o in board["opportunities"]]
          assert len(ids) == len(set(ids)), "duplicate opportunity ids"
          for o in board["opportunities"]:
              assert o.get("name"), f"{o['id']}: missing name"
              assert o.get("confidence"), f"{o['id']}: missing confidence"
          json.load(open("data/updates.json"))
          print(f"ok — {len(ids)} opportunities validated")
          PY

      # Supabase is optional. Without credentials the board still works — you
      # just lose forecasting, which needs history the JSON file can't query.
      - name: Sync to Supabase and refresh forecasts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::Supabase not configured — skipping sync and forecast."
            exit 0
          fi
          python3 scripts/sonar_db.py push
          python3 scripts/sonar_db.py forecast
          python3 scripts/sonar_db.py health || true

      # web/ (sonar-radar) reads the live board from its OWN, separate
      # Supabase project — not the one above, and not data/opportunities.json
      # directly. Without this, the deployed site drifts from the repo's
      # verified data (it shipped with Lovable-generated placeholder rows).
      - name: Sync the board to sonar-radar's Supabase project
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_SUPABASE_SERVICE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$RADAR_SUPABASE_URL" ] || [ -z "$RADAR_SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::RADAR_SUPABASE_URL/RADAR_SUPABASE_SERVICE_KEY not set — the live site will keep showing whatever it last had, not this data."
            exit 0
          fi
          python3 scripts/sync_radar.py push

      - name: Commit only if the data actually moved
        run: |
          git config user.name  "sonar-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/; then
            echo "no data change"
          else
            git add data/
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Verify the site still builds
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: regenerate
    if: ${{ always() }}
    steps:
      # Vercel → Project → Settings → Git → Deploy Hooks → create one,
      # then store the URL as the VERCEL_DEPLOY_HOOK repository secret.
      - name: Trigger Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK not set — countdowns will go stale."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" -o /dev/null -w "vercel hook: %{http_code}\n"
