name: Smoke test (deployed site)

# Runs after Vercel reports a successful deployment, daily, and on demand.
# A Vercel deployment behind Vercel Authentication answers 401 to anything
# without a session; add the project's "Protection Bypass for Automation"
# secret as VERCEL_PROTECTION_BYPASS so this can reach it.

on:
  deployment_status:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test"
        required: false
        default: "https://sonar-two-brown.vercel.app"

permissions:
  contents: read

jobs:
  smoke:
    # For deployment_status runs, only act on successful production deployments.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Choose the URL
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DEPLOYED: ${{ github.event.deployment_status.environment_url }}
          INPUT: ${{ github.event.inputs.url }}
        run: |
          case "$EVENT" in
            deployment_status) URL="$DEPLOYED" ;;
            workflow_dispatch) URL="${INPUT:-https://sonar-two-brown.vercel.app}" ;;
            *) URL="https://sonar-two-brown.vercel.app" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          TARGET: ${{ steps.target.outputs.url }}
        run: python3 scripts/smoke_check.py "$TARGET"
